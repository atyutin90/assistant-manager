<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<div th:replace="~{fragments/profile-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/profile-header :: profile-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h1 class="h3 mb-0" th:text="#{staff-evaluations.assigned-staff-evaluations}">Assigned evaluations</h1>
            <span class="badge text-bg-secondary" th:text="${staffEvaluations.totalElements}">0</span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col" th:text="#{staff-evaluation.name}">Name</th>
                <th scope="col" th:text="#{staff-evaluation.date-from}">Date from</th>
                <th scope="col" th:text="#{staff-evaluation.date-to}">Date to</th>
                <th scope="col" th:text="#{employee.project-role}">Project role</th>
                <th scope="col" th:text="#{staff-evaluation.staff-evaluation-user-status}">Survey status</th>
                <th scope="col" th:text="#{actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${staffEvaluations.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4" th:text="#{staff-evaluations.assigned-empty}">
                    No assigned evaluations
                </td>
            </tr>
            <tr th:each="staffEvaluation : ${staffEvaluations.content}">
                <td th:text="${staffEvaluation.name}">Evaluation</td>
                <td th:text="${#temporals.format(staffEvaluation.dateFrom, 'dd.MM.yyyy')}">01.01.2026</td>
                <td th:text="${#temporals.format(staffEvaluation.dateTo, 'dd.MM.yyyy')}">31.01.2026</td>
                <td><span class="badge text-bg-secondary" th:text="${staffEvaluation.projectRole ?: '—'}">Role</span></td>
                <td>
                    <span class="badge"
                          th:classappend="${staffEvaluation.staffEvaluationUserStatus.name() == 'VERIFICATION'
                              ? 'text-bg-warning'
                              : (staffEvaluation.staffEvaluationUserStatus.name() == 'COMPLETED'
                                  ? 'text-bg-success'
                                  : 'text-bg-secondary')}"
                          th:text="${#messages.msg('StaffEvaluationUserStatus.' + staffEvaluation.staffEvaluationUserStatus.name())}">
                        In progress
                    </span>
                </td>
                <td>
                    <a class="btn btn-secondary btn-sm"
                       th:if="${staffEvaluation.staffEvaluationStatus.name() == 'ACTIVE' && (staffEvaluation.staffEvaluationUserStatus.name() == 'NEW' || staffEvaluation.staffEvaluationUserStatus.name() == 'IN_PROGRESS') && staffEvaluation.projectRoleCode() != null}"
                       th:href="@{/survey/{evaluationId}/{role}(evaluationId=${staffEvaluation.staffEvaluationId}, role=${staffEvaluation.projectRoleCode()})}"
                       th:title="#{survey.start-or-continue}">
                        <i class="fas fa-arrow-right"></i>
                    </a>
                    <a class="btn btn-outline-success btn-sm"
                       th:if="${staffEvaluation.staffEvaluationStatus.name() == 'ACTIVE' && staffEvaluation.staffEvaluationUserStatus.name() == 'FEEDBACK'}"
                       th:href="@{/survey/{assignmentId}/feedback(assignmentId=${staffEvaluation.staffEvaluationUserId})}"
                       th:title="#{feedback.leave}">
                        <i class="fas fa-flag-checkered"></i>
                    </a>
                    <a class="btn btn-outline-primary btn-sm"
                       th:if="${staffEvaluation.staffEvaluationUserStatus.name() == 'VERIFICATION' || staffEvaluation.staffEvaluationUserStatus.name() == 'COMPLETED'}"
                       th:href="@{/staff-evaluations/{id}/detail(id=${staffEvaluation.staffEvaluationUserId})}"
                       th:title="#{staff-evaluation-results.open}">
                        <i class="fas fa-chart-column"></i>
                    </a>
                    <span class="text-muted small"
                          th:if="${(staffEvaluation.staffEvaluationStatus.name() != 'ACTIVE' && staffEvaluation.staffEvaluationUserStatus.name() != 'VERIFICATION' && staffEvaluation.staffEvaluationUserStatus.name() != 'COMPLETED') || ((staffEvaluation.staffEvaluationUserStatus.name() == 'NEW' || staffEvaluation.staffEvaluationUserStatus.name() == 'IN_PROGRESS') && staffEvaluation.projectRole == null)}"
                          th:text="#{staff-evaluations.no-actions}">
                        No actions
                    </span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/paging :: paggination('/staff-evaluations')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
