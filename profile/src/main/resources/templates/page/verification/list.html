<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<div th:replace="~{fragments/profile-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/profile-header :: profile-header}"></div>

<main class="container flex-grow-1 py-4">
    <div th:replace="~{fragments/success-operation-message :: infoMessage(${verificationCompleted}, #{verification.completed})}"></div>

    <div class="d-flex align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0" th:text="#{verification.title}">Surveys awaiting verification</h1>
        <span class="badge text-bg-secondary" th:text="${verifications.totalElements}">0</span>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th scope="col" th:text="#{verification.employee}">Employee</th>
                <th scope="col" th:text="#{staff-evaluation.name}">Evaluation</th>
                <th scope="col" th:text="#{employee.project-role}">Project role</th>
                <th scope="col" th:text="#{verification.owner}">Verification owner</th>
                <th scope="col" th:text="#{staff-evaluation.date-from}">Date from</th>
                <th scope="col" th:text="#{staff-evaluation.date-to}">Date to</th>
                <th scope="col" th:text="#{actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${verifications.isEmpty()}">
                <td colspan="7" class="text-center text-muted py-4" th:text="#{verification.empty}">
                    No surveys are awaiting verification
                </td>
            </tr>
            <tr th:each="verification : ${verifications.content}">
                <td>
                    <div class="fw-semibold" th:text="${verification.employeeName}">Employee</div>
                    <div class="small text-muted" th:text="${verification.employeeUsername}">username</div>
                </td>
                <td th:text="${verification.name}">Evaluation</td>
                <td><span class="badge text-bg-secondary" th:text="${verification.projectRole ?: '—'}">Role</span></td>
                <td>
                    <span th:if="${#strings.isEmpty(verification.verificationOwner)}"
                          class="text-muted"
                          th:text="#{verification.not-taken}">Not taken</span>
                    <span th:unless="${#strings.isEmpty(verification.verificationOwner)}"
                          class="fw-semibold"
                          th:text="${verification.verificationOwner}">Owner</span>
                </td>
                <td th:text="${#temporals.format(verification.dateFrom, 'dd.MM.yyyy')}">01.01.2026</td>
                <td th:text="${#temporals.format(verification.dateTo, 'dd.MM.yyyy')}">31.01.2026</td>
                <td>
                    <div class="d-flex flex-nowrap">
                        <form th:if="${verification.canTake}"
                              method="post"
                              th:action="@{/verifications/{id}/take(id=${verification.staffEvaluationUserId})}">
                            <button class="btn btn-outline-primary btn-sm"
                                    type="submit"
                                    th:title="#{verification.take}"
                                    th:aria-label="#{verification.take}">
                                <i class="fas fa-hand"></i>
                            </button>
                        </form>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/verifications/{id}(id=${verification.staffEvaluationUserId})}"
                           th:title="#{verification.view}"
                           th:aria-label="#{verification.view}">
                            <i class="fas fa-eye"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:replace="~{fragments/paging :: paggination('/verifications')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
