<div th:fragment="infoMessage(resultParam, message)">
    <div th:if="${resultParam}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">
        <span th:text="${message}">Message</span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

</div>
