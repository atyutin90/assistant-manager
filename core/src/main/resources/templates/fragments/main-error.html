<div th:fragment="error">
    <main class="container flex-grow-1 d-flex align-items-center py-5">
        <div class="row justify-content-center w-100">
            <div class="col-lg-6 col-md-8 col-12">

                <div class="card glass-card shadow-lg shadow-hover border-0 rounded-4 p-4 p-md-5 text-center">
                    <div class="card-body">

                        <div class="mb-4">
                            <i class="bi bi-exclamation-triangle-fill text-danger error-icon"></i>
                        </div>

                        <h1 class="status-code text-danger" th:text="${status}">500</h1>

                        <h2 class="h4 text-dark fw-semibold mt-3 mb-2" th:text="${message}">Error message</h2>

                        <p class="text-muted mb-4">
                            <i class="bi bi-arrow-right-circle me-1" th:text="#{error.error-page-text}">
                                Try refreshing the page or returning to the home page
                            </i>
                        </p>

                        <div class="d-grid gap-3 d-sm-flex justify-content-sm-center">
                            <a href="/" class="btn btn-outline-danger btn-sm" th:title="#{button.home}" th:aria-label="#{button.home}">
                                <i class="fas fa-house"></i>
                            </a>
                            <button class="btn btn-outline-secondary btn-sm"
                                    onclick="location.reload()"
                                    th:title="#{button.refresh}"
                                    th:aria-label="#{button.refresh}">
                                <i class="fa-solid fa-arrow-rotate-right"></i>
                            </button>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
