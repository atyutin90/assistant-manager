<div th:fragment="errorMessage(message)">
    <div th:if="${message != null}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">
        <span th:text="${message}">Message</span>
        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

</div>
