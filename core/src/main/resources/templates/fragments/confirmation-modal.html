<div th:fragment="confirmationModal(visible, modalId, action, title, confirm, confirmClass)">
    <div th:if="${visible}" class="modal fade" th:id="${modalId}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form class="modal-content" method="post" th:action="${action}">
                <div class="modal-header">
                    <h5 class="modal-title" th:text="${title}">Confirmation</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{cancel}"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-0" th:text="${confirm}">Continue?</p>
                </div>
                <div class="modal-footer d-flex justify-content-center gap-2">
                    <button type="button"
                            class="btn btn-outline-secondary btn-sm"
                            data-bs-dismiss="modal"
                            th:title="#{filter.enabled.no}"
                            th:aria-label="#{filter.enabled.no}">
                        <i class="fas fa-xmark"></i>
                    </button>
                    <button type="submit"
                            class="btn btn-sm"
                            th:classappend="${confirmClass}"
                            th:title="#{filter.enabled.yes}"
                            th:aria-label="#{filter.enabled.yes}">
                        <i class="fas fa-check"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
