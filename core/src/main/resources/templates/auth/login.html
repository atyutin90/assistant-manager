<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>
<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="w-100" style="max-width: 500px;">

        <!-- Логотип -->
        <div class="text-center mb-4">
            <img th:src="@{/images/logo_login.svg}" src="/images/logo_login.svg" alt="Logo" style="max-height: 100px;">
        </div>

        <!-- Ошибка входа -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
            <span th:text="#{error.invalid-username-or-password}">Invalid username or password</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Недостаточно прав -->
        <div th:if="${param.forbidden}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
            <span th:text="#{error.insufficient-permissions}">Insufficient permissions</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Выход выполнен -->
        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show text-center" role="alert">
            <span th:text="#{info.you-have-been-logged-out}">You have been logged out</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Форма входа -->
        <form th:action="@{/login}" method="post" class="mt-4">
            <div class="mb-3 text-center">
                <label for="username" class="form-label" th:text="#{username}">Username</label>
                <input type="text" class="form-control" id="username" name="username" th:placeholder="#{username}">
            </div>

            <div class="mb-3 text-center">
                <label for="password" class="form-label" th:text="#{password}">Password</label>
                <input type="password" class="form-control" id="password" name="password" th:placeholder="#{password}">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" th:text="#{sign-in}">Sign in</button>
            </div>

            <!-- Выбор локали -->
            <div class="d-flex justify-content-center gap-3 mt-3">

                <a th:href="@{/login(lang=ru)}"
                   class="text-decoration-none fs-4"
                   th:classappend="${#locale.language == 'ru'} ? 'opacity-100 border-bottom border-2' : 'opacity-50'">
                    🇷🇺
                </a>

                <a th:href="@{/login(lang=en)}"
                   class="text-decoration-none fs-4"
                   th:classappend="${#locale.language == 'en'} ? 'opacity-100 border-bottom border-2' : 'opacity-50'">
                    🇬🇧
                </a>
            </div>

        </form>

    </div>
</div>

</body>

</html>
