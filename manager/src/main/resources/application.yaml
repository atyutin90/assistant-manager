server:
  port: 8891

spring:
  application:
    name: manager
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?currentSchema=assistant_db2
    username: postgres
    password: example
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.hibernate.format_sql: true
  #Туннелирование запроса DELETE через POST
  mvc:
    hiddenmethod:
      filter:
        enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "metrics, health"
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: "otusotusotusotusotusotusotusotus"
    expiration-times: 30m
    cookie-name: MANAGER_JWT_TOKEN
    secure-cookie: true
  default-password: "1111"
