<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/manager-header :: manager-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h1 class="h3 mb-0" th:text="#{manager.configure-levels}">
                Configure question levels
            </h1>
            <div class="text-muted">
                <span th:text="${project.name}">Project</span>
                <span class="badge text-bg-secondary ms-2"
                      th:if="${filter.projectRole != null}"
                      th:text="${questionPage.totalElements}">0</span>
            </div>
        </div>
        <div class="btn-group" role="group">
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects}"
               th:title="#{list}"
               th:aria-label="#{list}">
                <i class="fas fa-list"></i>
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects/{id}(id=${project.id})}"
               th:title="#{edit}"
               th:aria-label="#{edit}">
                <i class="fas fa-pen"></i>
            </a>
            <button th:if="${canEdit}"
                    class="btn btn-outline-secondary btn-sm"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#upload-project-questions-modal"
                    th:title="#{upload-file}"
                    th:aria-label="#{upload-file}">
                <i class="fas fa-upload"></i>
            </button>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects/{id}/questions/download(id=${project.id}, search=${filter.search}, projectRole=${filter.projectRole}, skill=${filter.skill}, enabled=${filter.enabled})}"
               th:title="#{download-file}"
               th:aria-label="#{download-file}">
                <i class="fas fa-download"></i>
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${successOperation}, #{manager.levels-saved})}"></div>
    <div th:replace="~{fragments/error-operation-message :: errorMessage(${error})}"></div>

    <form class="mb-3" method="get" th:action="@{/projects/{id}/questions(id=${project.id})}">
        <div class="row g-2 mb-2 align-items-center">
            <div class="col-md-4">
                <label class="form-label" for="projectRole" th:text="#{project-role}">Project role</label>
                <select id="projectRole"
                        class="form-select"
                        name="projectRole">
                    <option value="" th:text="#{manager.select-project-role}">Select project role</option>
                    <option th:each="role : ${projectRoles}"
                            th:value="${role.id}"
                            th:text="${role.value}"
                            th:selected="${role.id == filter.projectRole}">
                        Role
                    </option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="skill"
                       th:text="#{question.skill}">
                    Skill
                </label>
                <select id="skill"
                        class="form-select"
                        name="skill">
                    <option value="" th:text="#{filter.all-skills}">
                        All skills
                    </option>
                    <option th:each="skill : ${skills}"
                            th:value="${skill.id}"
                            th:text="${skill.value}"
                            th:selected="${skill.id == filter.skill}">
                        Skill
                    </option>
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label" for="enabled"
                       th:text="#{question.enabled}">
                    Enabled
                </label>
                <select id="enabled"
                        class="form-select"
                        name="enabled">
                    <option value=""
                            th:selected="${filter.enabled == null}"
                            th:text="#{filter.all}">
                        All
                    </option>
                    <option value="true"
                            th:selected="${filter.enabled == true}"
                            th:text="#{filter.enabled.yes}">
                        Yes
                    </option>
                    <option value="false"
                            th:selected="${filter.enabled == false}"
                            th:text="#{filter.enabled.no}">
                        No
                    </option>
                </select>
            </div>
        </div>
        <div>
            <input name="search"
                   type="search"
                   class="form-control"
                   th:value="${filter.search}"
                   th:placeholder="#{filter.search}"
                   th:aria-label="#{filter.search}">
        </div>
        <div class="d-flex justify-content-end mt-2">
            <button class="btn btn-outline-primary btn-sm"
                    type="submit"
                    th:title="#{filter.search}"
                    th:aria-label="#{filter.search}">
                <i class="fas fa-search"></i>
            </button>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects/{id}/questions(id=${project.id})}"
               th:title="#{reset-search}"
               th:aria-label="#{reset-search}">
                <i class="fa-solid fa-broom"></i>
            </a>
        </div>
    </form>

    <div class="alert alert-secondary"
         role="alert"
         th:if="${filter.projectRole == null}"
         th:text="#{manager.select-role-to-show-questions}">
        Select a project role to display questions
    </div>

    <form th:if="${filter.projectRole != null}" method="post"
          th:action="@{/projects/{id}/questions(id=${project.id})}"
          th:object="${questionLevels}">
        <input type="hidden"
               name="projectRole"
               th:value="${filter.projectRole}">
        <input th:if="${filter.skill != null}"
               type="hidden"
               name="skill"
               th:value="${filter.skill}">
        <input th:if="${filter.enabled != null}"
               type="hidden"
               name="enabled"
               th:value="${filter.enabled}">
        <input th:if="${filter.search != null and !filter.search.isBlank()}"
               type="hidden"
               name="search"
               th:value="${filter.search}">
        <input type="hidden"
               name="page"
               th:value="${currentPage}">

        <div class="d-flex justify-content-end mb-2">
            <button th:if="${canEdit and !questionPage.isEmpty()}"
                    type="submit"
                    class="btn btn-outline-success btn-sm"
                    th:title="#{manager.save-levels}"
                    th:aria-label="#{manager.save-levels}">
                <i class="fas fa-floppy-disk"></i>
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th scope="col" th:text="#{question.uuid}">uuid</th>
                        <th scope="col" th:text="#{question.enabled}">Enabled</th>
                        <th scope="col" th:text="#{project-role}">Project role</th>
                        <th scope="col" th:text="#{question.skill}">Skill</th>
                        <th scope="col" th:text="#{question.area-knowledge}">Area</th>
                        <th scope="col" th:text="#{question.section}">Section</th>
                        <th scope="col" th:text="#{question.text}">Question</th>
                        <th scope="col" style="min-width: 210px;"
                            th:text="#{manager.career-level}">
                            Career level
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(questionLevels.questions)}">
                        <td colspan="8" class="text-center text-muted py-4"
                            th:text="#{questions.empty}">
                            No questions
                        </td>
                    </tr>
                    <tr th:each="question, iteration : *{questions}">
                        <td th:text="${question.uuid()}">Uuid</td>
                        <td th:if="${question.enabled != null}">
                            <i th:class="${question.enabled ? 'fas fa-check text-success' : 'fas fa-xmark text-secondary'}"></i>
                        </td>
                        <td th:text="${question.projectRole}">Role</td>
                        <td th:text="${question.skill}">Skill</td>
                        <td th:text="${question.areaKnowledge}">Area</td>
                        <td th:text="${question.section}">Section</td>
                        <td th:text="${question.text}">Question</td>
                        <td>
                            <input type="hidden"
                                   th:field="*{questions[__${iteration.index}__].questionId}">
                            <select class="form-select form-select-sm"
                                    th:disabled="${!canEdit}"
                                    th:field="*{questions[__${iteration.index}__].careerLevelId}">
                                <option value="" th:text="#{manager.level-not-assigned}">Not assigned</option>
                                <option th:each="level : ${careerLevels}"
                                        th:value="${level.id}"
                                        th:text="${level.value}">
                                    Level
                                </option>
                            </select>
                        </td>
                    </tr>
                    </tbody>
            </table>
        </div>
    </form>

    <div th:if="${filter.projectRole != null}"
         th:replace="~{fragments/paging :: paggination(${questionPageSource})}">
    </div>
</main>

<div class="modal fade" id="upload-project-questions-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" method="post" enctype="multipart/form-data"
              th:action="@{/projects/{id}/questions/upload(id=${project.id})}">
            <div class="modal-header">
                <h5 class="modal-title" th:text="#{upload-questions}">Upload questions</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" th:aria-label="#{cancel}"></button>
            </div>
            <div class="modal-body">
                <input class="form-control"
                       type="file"
                       name="file"
                       accept=".csv,text/csv"
                       th:aria-label="#{upload-file}">
            </div>
            <div class="modal-footer d-flex justify-content-center gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal"
                        th:title="#{cancel}" th:aria-label="#{cancel}">
                    <i class="fas fa-xmark"></i>
                </button>
                <button type="submit" class="btn btn-outline-primary btn-sm"
                        th:title="#{upload-file}" th:aria-label="#{upload-file}">
                    <i class="fas fa-upload"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
