<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/manager-header :: manager-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0"
            th:text="${isEdit} ? #{manager.project-edit} : #{manager.project-create}">
            Project
        </h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${successOperation}, #{employee.project-saved})}"></div>

    <form class="row g-3"
          method="post"
          th:action="@{/projects}"
          th:object="${project}">
        <input type="hidden" th:field="*{id}">

        <div class="col-12" th:if="${isEdit}">
            <label class="form-label gap-2" th:text="#{manager.project-owner}"/>
            <span class="text-muted" th:text="*{ownerUsername}">username</span>
        </div>

        <div class="col-12">
            <div class="form-check">
                <input id="active"
                       class="form-check-input"
                       type="checkbox"
                       th:field="*{active}">
                <label class="form-check-label" for="active"
                       th:text="#{manager.project-active}">
                    Active
                </label>
                <div class="text-danger small"
                     th:if="${#fields.hasErrors('active')}"
                     th:errors="*{active}">
                </div>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label" for="name" th:text="#{manager.project-name}">
                Name
            </label>
            <input id="name"
                   class="form-control"
                   type="text"
                   th:field="*{name}"
                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('name')}"
                 th:errors="*{name}">
            </div>
        </div>

        <div class="col-12">
            <label class="form-label" for="description"
                   th:text="#{manager.project-description}">
                Description
            </label>
            <textarea id="description"
                      class="form-control"
                      rows="5"
                      th:field="*{description}"
                      th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'">
            </textarea>
            <div class="text-danger small"
                 th:if="${#fields.hasErrors('description')}"
                 th:errors="*{description}">
            </div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/projects}"
               th:title="#{list}"
               th:aria-label="#{list}">
                <i class="fas fa-list"></i>
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:if="${isEdit}"
               th:href="@{/projects/{id}/questions(id=${project.id})}"
               th:title="#{manager.configure-levels}"
               th:aria-label="#{manager.configure-levels}">
                <i class="fas fa-list-check"></i>
            </a>
            <a class="btn btn-outline-secondary btn-sm"
               th:if="${canManageAccess}"
               th:href="@{/projects/{id}/access(id=${project.id})}"
               th:title="#{manager.project-access}"
               th:aria-label="#{manager.project-access}">
                <i class="fas fa-user-shield"></i>
            </a>
            <button class="btn btn-outline-success btn-sm"
                    type="submit"
                    th:title="#{save}"
                    th:aria-label="#{save}">
                <i class="fas fa-save"></i>
            </button>
            <button th:if="${canManageAccess}"
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#delete-modal"
                    th:title="#{delete}"
                    th:aria-label="#{delete}">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(
    ${canManageAccess},
    '/projects/' + ${project.id},
    #{manager.project-delete-title},
    #{manager.project-delete-confirm}
)}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
