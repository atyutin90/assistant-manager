<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/manager-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">
<div th:replace="~{fragments/manager-header :: manager-header}"></div>

<main class="container-fluid flex-grow-1 d-flex flex-column px-2 px-lg-3 py-2">
    <div class="mb-2">
        <h1 class="h5 mb-0" th:text="#{ai-search.title}">AI employee search</h1>
        <p class="text-muted small mb-0" th:text="#{ai-search.description}">
            Describe the required experience or skills
        </p>
    </div>

    <section class="card border-0 shadow-sm overflow-hidden flex-grow-1"
             id="ai-chat"
             th:data-welcome="#{ai-search.welcome}"
             th:data-error="#{ai-search.error}"
             th:data-empty="#{ai-search.empty-message}"
             th:data-response-time="#{ai-search.response-time}"
             th:data-seconds="#{ai-search.seconds}">
        <div id="chat-messages"
             class="card-body bg-white d-flex flex-column gap-2 overflow-auto p-2 small lh-sm"
             style="height: calc(100vh - 230px); min-height: 320px"
             aria-live="polite">
        </div>

        <form id="chat-form" class="card-footer bg-light p-2">
            <div class="input-group input-group-sm">
                <textarea id="chat-input"
                          class="form-control"
                          rows="1"
                          maxlength="2000"
                          th:placeholder="#{ai-search.placeholder}"
                          th:aria-label="#{ai-search.placeholder}"></textarea>
                <button id="chat-submit"
                        class="btn btn-primary px-3"
                        th:title="#{ai-search.send}"
                        th:aria-label="#{save}"
                        type="submit">
                    <i class="fas fa-paper-plane me-1"></i>
                </button>
            </div>
            <div class="form-text small mt-1" th:text="#{ai-search.hint}">
                Only latest verified positive answers are considered
            </div>
        </form>
    </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
    (() => {
        const chat = document.getElementById('ai-chat');
        const messages = document.getElementById('chat-messages');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');
        const submit = document.getElementById('chat-submit');

        const renderMarkdown = (element, markdown) => {
            if (!window.marked) {
                element.textContent = markdown;
                return;
            }
            const escaped = markdown.replace(/[&<>]/g, character => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;'
            })[character]);
            element.innerHTML = marked.parse(escaped, {breaks: true});
            element.querySelectorAll('p, ul, ol, pre, blockquote').forEach(node => node.classList.add('mb-1'));
            element.querySelectorAll('ul, ol').forEach(node => node.classList.add('ps-3'));
            element.querySelectorAll('a').forEach(link => link.replaceWith(link.textContent));
            element.querySelectorAll('img').forEach(image => image.remove());
        };

        const addMessage = (text, own = false, duration = null) => {
            const row = document.createElement('div');
            row.className = `d-flex ${own ? 'justify-content-end' : 'justify-content-start'}`;

            const content = document.createElement('div');
            content.className = `d-flex flex-column ${own ? 'align-items-end' : 'align-items-start'}`;
            if (own) {
                content.style.maxWidth = '75%';
            } else {
                content.classList.add('w-100');
            }

            const bubble = document.createElement('div');
            bubble.className = own
                ? 'bg-primary text-white rounded-2 px-2 py-1'
                : 'bg-light border rounded-2 px-2 py-1 w-100';
            if (own) {
                bubble.style.whiteSpace = 'pre-wrap';
                bubble.textContent = text;
            } else {
                renderMarkdown(bubble, text);
            }
            content.appendChild(bubble);
            if (!own && duration !== null) {
                const timing = document.createElement('small');
                timing.className = 'text-muted mt-1 px-1';
                timing.textContent = `${chat.dataset.responseTime}: `
                    + `${(duration / 1000).toFixed(2)} ${chat.dataset.seconds}`;
                content.appendChild(timing);
            }
            row.appendChild(content);
            messages.appendChild(row);
            messages.scrollTop = messages.scrollHeight;
            return row;
        };

        addMessage(chat.dataset.welcome);

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const message = input.value.trim();
            if (!message) {
                /*input.setCustomValidity(chat.dataset.empty);
                input.reportValidity();*/
                return;
            }

            input.setCustomValidity('');
            addMessage(message, true);
            input.value = '';
            input.disabled = true;
            submit.disabled = true;
            const pending = addMessage('');
            pending.querySelector('.border').innerHTML =
                '<span class="spinner-border spinner-border-sm" aria-hidden="true"></span>';

            try {
                const response = await fetch('/api/employees/ai-search', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message})
                });
                if (response.status === 401) {
                    window.location.assign('/login');
                    return;
                }
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const payload = await response.json();
                pending.remove();
                addMessage(payload.answer || chat.dataset.error, false, payload.duration);
            } catch (error) {
                pending.remove();
                addMessage(chat.dataset.error);
            } finally {
                input.disabled = false;
                submit.disabled = false;
                input.focus();
            }
        });

        input.addEventListener('keydown', event => {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                form.requestSubmit();
            }
        });
    })();
</script>
</body>
</html>
