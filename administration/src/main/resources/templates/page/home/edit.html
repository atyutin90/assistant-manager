<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/admin-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<div class="container flex-grow-1 d-flex align-items-center">
    <div class="row w-100 g-4">

        <div class="col-md-4">
            <a href="/staff-evaluations" class="text-decoration-none">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <i class="fas fa-list display-4"></i>
                        <h4 class="mt-3" th:text="#{staff-evaluations}">Staff Evaluations</h4>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/users" class="text-decoration-none">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <i class="fas fa-users display-4"></i>
                        <h4 class="mt-3" th:text="#{employees.tab}">Employees</h4>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/questions" class="text-decoration-none">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <i class="fa-solid fa-question display-4"></i>
                        <h4 class="mt-3" th:text="#{questions.tab}">Questions</h4>
                    </div>
                </div>
            </a>
        </div>

    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
