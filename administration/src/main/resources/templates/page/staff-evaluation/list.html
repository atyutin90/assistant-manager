<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/admin-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h1 class="h3 mb-0" th:text="#{staff-evaluations}">Staff-Evaluations</h1>
            <span class="badge text-bg-secondary" th:text="${staffEvaluations.totalElements}">0</span>
        </div>
        <div class="btn-group" role="group">
            <a class="btn btn-outline-success btn-sm" th:href="@{/staff-evaluations/new}" th:title="#{add}">
                <i class="fas fa-plus"></i>
            </a>
        </div>
    </div>

    <form class="mb-3" method="get" th:action="@{/staff-evaluations}">
        <div>
            <input name="search"
                   type="search"
                   class="form-control"
                   th:value="${filter.search}"
                   th:placeholder="#{filter.search}"
                   th:aria-label="#{filter.search}">
        </div>
        <div class="d-flex justify-content-end mt-2">
            <button class="btn btn-outline-primary btn-sm" type="submit" th:title="#{filter.search}" th:aria-label="#{filter.search}">
                <i class="fas fa-search"></i>
            </button>
            <a class="btn btn-outline-secondary btn-sm"
               th:href="@{/staff-evaluations}"
               th:title="#{reset-search}"
               th:aria-label="#{reset-search}">
                <i class="fa-solid fa-broom"></i>
            </a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th th:replace="~{fragments/sorting :: sorting('/staff-evaluations', 'id', #{staff-evaluation.id})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/staff-evaluations', 'name', #{staff-evaluation.name})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/staff-evaluations', 'dateFrom', #{staff-evaluation.date-from})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/staff-evaluations', 'dataTo', #{staff-evaluation.date-to})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/staff-evaluations', 'status', #{staff-evaluation.status})}"></th>
                <th scope="col" th:text="#{actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${staffEvaluations.isEmpty()}">
                <td colspan="6" class="text-center text-muted py-4" th:text="#{staff-evaluations.empty}">No data</td>
            </tr>
            <tr th:each="staffEvaluation : ${staffEvaluations.content}">
                <td th:text="${staffEvaluation.id}">1</td>
                <td th:text="${staffEvaluation.name}">Name</td>
                <td th:text="${staffEvaluation.dateFrom != null} ? ${#temporals.format(staffEvaluation.dateFrom, 'dd.MM.yyyy')} : ''">Date From</td>
                <td th:text="${staffEvaluation.dateTo != null} ? ${#temporals.format(staffEvaluation.dateTo, 'dd.MM.yyyy')} : ''">Date To</td>
                <td>
                    <span class="badge"
                          th:classappend="${staffEvaluation.draft} ? 'text-bg-secondary' : (${staffEvaluation.active} ? 'text-bg-success' : 'text-bg-danger')"
                          th:text="${#messages.msg('StaffEvaluationStatus.' + staffEvaluation.status.name())}">Draft</span>
                </td>
                <td>
                    <div class="btn-group flex-nowrap" role="group">
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/staff-evaluations/{id}(id=${staffEvaluation.id})}"
                           th:title="#{edit}"
                           th:aria-label="#{edit}">
                            <i class="fas fa-pen"></i>
                        </a>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/staff-evaluations/{id}/employees(id=${staffEvaluation.id})}"
                           th:title="#{staff-evaluation.manage-employees}"
                           th:aria-label="#{staff-evaluation.manage-employees}">
                            <i class="fas fa-users"></i>
                        </a>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/staff-evaluations/{id}/questions(id=${staffEvaluation.id})}"
                           th:title="#{staff-evaluation.manage-questions}"
                           th:aria-label="#{staff-evaluation.manage-questions}">
                            <i class="fa-solid fa-question"></i>
                        </a>
                        <a class="btn btn-outline-secondary btn-sm"
                           th:href="@{/staff-evaluations/{id}/statistics(id=${staffEvaluation.id})}"
                           th:title="#{staff-evaluation.statistics}"
                           th:aria-label="#{staff-evaluation.statistics}">
                            <i class="fa-solid fa-chart-column"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/paging :: paggination('/staff-evaluations')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
