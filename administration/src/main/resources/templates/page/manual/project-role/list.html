<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/admin-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h1 class="h3 mb-0" th:text="#{project-roles}">Project roles</h1>
            <span class="badge text-bg-secondary" th:text="${projectRoles.totalElements}">0</span>
        </div>
        <div class="btn-group" role="group">
            <a class="btn btn-outline-success btn-sm" th:href="@{project-roles/new}" th:title="#{add}">
                <i class="fas fa-plus"></i>
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th th:replace="~{fragments/sorting :: sorting('/project-roles', 'id', #{project-roles.id})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/project-roles', 'enabled', #{project-roles.enabled})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/project-roles', 'code', #{project-roles.code})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/project-roles', 'name', #{project-roles.name})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/project-roles', 'position', #{project-roles.position})}"></th>
                <th scope="col" th:text="#{actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${projectRoles.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4" th:text="#{project-roles.empty}">No data</td>
            </tr>
            <tr th:each="projectRole : ${projectRoles.content}">
                <td th:text="${projectRole.id}">Id</td>
                <td>
                    <i th:class="${projectRole.enabled ? 'fas fa-check text-success' : 'fas fa-xmark text-secondary'}"></i>
                </td>
                <td th:text="${projectRole.code}">Code</td>
                <td th:text="${projectRole.name}">Name</td>
                <td th:text="${projectRole.position}">Position</td>
                <td>
                    <div class="btn-group flex-nowrap" role="group">
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/project-roles/{id}(id=${projectRole.id})}"
                           th:title="#{edit}"
                           th:aria-label="#{edit}">
                            <i class="fas fa-pen"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/paging :: paggination('/project-roles')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
