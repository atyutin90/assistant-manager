<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="#{career-levels}">Career Level</h1>
        <div class="btn-group" role="group">
            <a class="btn btn-outline-success btn-sm" th:href="@{/career-levels/new}" th:title="#{add}">
                <i class="fas fa-plus"></i>
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th th:replace="~{fragments/sorting :: sorting('/career-levels', 'id', #{career-levels.id})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/career-levels', 'enabled', #{career-levels.enabled})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/career-levels', 'code', #{career-levels.code})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/career-levels', 'name', #{career-levels.name})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/career-levels', 'position', #{career-levels.position})}"></th>
                <th scope="col" th:text="#{actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${careerLevels.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4" th:text="#{career-levels.empty}">No data</td>
            </tr>
            <tr th:each="careerLevel : ${careerLevels.content}">
                <td th:text="${careerLevel.id}">Id</td>
                <td>
                    <i th:class="${careerLevel.enabled ? 'fas fa-check text-success' : 'fas fa-xmark text-secondary'}"></i>
                </td>
                <td th:text="${careerLevel.code}">Code</td>
                <td th:text="${careerLevel.name}">Name</td>
                <td th:text="${careerLevel.position}">Position</td>
                <td>
                    <div class="btn-group flex-nowrap" role="group">
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/career-levels/{id}(id=${careerLevel.id})}"
                           th:title="#{edit}"
                           th:aria-label="#{edit}">
                            <i class="fas fa-pen"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/paging :: paggination('/career-levels')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
