<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/admin-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex align-items-center gap-2">
            <h1 class="h3 mb-0" th:text="#{skills}">Skills</h1>
            <span class="badge text-bg-secondary" th:text="${skills.totalElements}">0</span>
        </div>
        <div class="btn-group" role="group">
            <a class="btn btn-outline-success btn-sm" th:href="@{skills/new}" th:title="#{add}">
                <i class="fas fa-plus"></i>
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead>
            <tr>
                <th th:replace="~{fragments/sorting :: sorting('/skills', 'id', #{skills.id})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/skills', 'enabled', #{skills.enabled})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/skills', 'code', #{skills.code})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/skills', 'name', #{skills.name})}"></th>
                <th th:replace="~{fragments/sorting :: sorting('/skills', 'position', #{skills.position})}"></th>
                <th scope="col" th:text="#{actions}">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${skills.isEmpty()}">
                <td colspan="8" class="text-center text-muted py-4" th:text="#{skills.empty}">No data</td>
            </tr>
            <tr th:each="skill : ${skills.content}">
                <td th:text="${skill.id}">Id</td>
                <td>
                    <i th:class="${skill.enabled ? 'fas fa-check text-success' : 'fas fa-xmark text-secondary'}"></i>
                </td>
                <td th:text="${skill.code}">Code</td>
                <td th:text="${skill.name}">Name</td>
                <td th:text="${skill.position}">Position</td>
                <td>
                    <div class="btn-group flex-nowrap" role="group">
                        <a class="btn btn-outline-primary btn-sm"
                           th:href="@{/skills/{id}(id=${skill.id})}"
                           th:title="#{edit}"
                           th:aria-label="#{edit}">
                            <i class="fas fa-pen"></i>
                        </a>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <div th:replace="~{fragments/paging :: paggination('/skills')}"></div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
