<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/admin-head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/admin-header :: admin-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0" th:text="${isEdit} ? #{technologies.edit} : #{technologies.create}">Skill</h1>
    </div>

    <div th:replace="~{fragments/success-operation-message :: infoMessage(${successOperation}, #{employee.project-saved})}"></div>

    <form class="row g-3"
          th:method="post"
          th:object="${technology}"
          th:action="@{/technologies}">

        <input type="hidden" th:field="*{id}"/>

        <div class="col-12">
            <div class="form-check">
                <input id="enabled" class="form-check-input" type="checkbox" th:field="*{enabled}">
                <label class="form-check-label" for="enabled" th:text="#{technologies.enabled}">Enabled</label>
                <div class="text-danger small" th:if="${#fields.hasErrors('enabled')}" th:errors="*{enabled}"></div>
            </div>
        </div>

        <div class="col-12">
            <label class="form-label" for="name" th:text="#{technologies.name}">Name</label>
            <input id="name" class="form-control" type="text" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="col-12 d-flex justify-content-center gap-2">
            <a class="btn btn-outline-secondary btn-sm" th:href="@{/technologies}" th:title="#{list}" th:aria-label="#{list}">
                <i class="fas fa-list"></i>
            </a>
            <button type="submit" class="btn btn-outline-success btn-sm" th:title="#{save}" th:aria-label="#{save}">
                <i class="fas fa-save"></i>
            </button>
            <button th:if="${isEdit}"
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    data-bs-toggle="modal"
                    data-bs-target="#delete-modal"
                    th:title="#{delete}"
                    th:aria-label="#{delete}">
                <i class="fas fa-trash"></i>
            </button>
        </div>
    </form>
</main>

<div th:replace="~{fragments/delete-modal :: deleteModal(${isEdit}, '/technologies/' + ${technology.id}, #{technologies.delete-title}, #{technologies.delete-confirm})}"></div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
