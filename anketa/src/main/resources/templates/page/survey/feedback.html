<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/anketa-header :: anketa-header}"></div>

<main class="container flex-grow-1 py-5">
    <div class="mx-auto" style="max-width: 720px;">

        <section class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 mb-2" th:text="#{feedback.title}">Feedback</h1>
                <p class="text-muted mb-4" th:text="#{feedback.description}">
                    Tell us about the evaluation process.
                </p>

                <form method="post"
                      th:action="@{/survey/{staffEvaluationId}/feedback(staffEvaluationId=${staffEvaluationId})}"
                      th:object="${feedback}">
                    <div class="mb-4">
                        <textarea class="form-control"
                                  rows="10"
                                  maxlength="4000"
                                  th:field="*{message}"
                                  th:classappend="${#fields.hasErrors('message')} ? 'is-invalid' : ''"
                                  th:placeholder="#{feedback.placeholder}"></textarea>
                        <div class="invalid-feedback"
                             th:if="${#fields.hasErrors('message')}"
                             th:text="#{feedback.required}">
                            Feedback is required
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-sm-row gap-2">
                        <button class="btn btn-outline-primary flex-grow-1"
                                type="submit"
                                name="action"
                                value="save"
                                th:title="#{feedback.save}">
                            <i class="fas fa-save"></i>
                        </button>
                        <button class="btn btn-success flex-grow-1"
                                type="submit"
                                name="action"
                                value="finish"
                                th:title="#{feedback.submit}">
                            <i class="fas fa-paper-plane "></i>
                        </button>
                        <a class="btn btn-secondary flex-grow-1"
                           th:href="@{/staff-evaluations}"
                           th:title="#{list}">
                            <i class="fas fa-list"></i>
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
