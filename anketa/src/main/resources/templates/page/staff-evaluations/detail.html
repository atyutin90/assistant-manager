<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<div th:replace="~{fragments/head :: head}"></div>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/anketa-header :: anketa-header}"></div>

<main class="container flex-grow-1 py-4">
    <div class="mx-auto" style="max-width: 960px;">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-3">
            <div>
                <div class="text-muted small" th:text="${result.name}">Evaluation</div>
                <h1 class="h3 mb-1" th:text="#{staff-evaluation-results.title}">Evaluation results</h1>
                <div class="text-muted">
                    <i class="far fa-calendar me-1"></i>
                    <span th:text="${#temporals.format(result.dateFrom, 'dd.MM.yyyy')}">01.01.2026</span>
                    <span>—</span>
                    <span th:text="${#temporals.format(result.dateTo, 'dd.MM.yyyy')}">31.01.2026</span>
                </div>
            </div>
            <div class="d-flex align-items-center gap-2">
                <span class="badge"
                      th:classappend="${result.status.name() == 'COMPLETED' ? 'text-bg-success' : 'text-bg-warning'}"
                      th:text="${#messages.msg('SurveyStatus.' + result.status.name())}">
                    Completed
                </span>
                <div class="btn-group" role="group">
                    <a class="btn btn-outline-secondary btn-sm"
                       th:href="@{/staff-evaluations}"
                       th:title="#{list}"
                       th:aria-label="#{list}">
                        <i class="fas fa-list"></i>
                    </a>
                </div>
            </div>
        </div>

        <section class="card border-0 shadow-sm mb-3">
            <div class="card-body p-3">
                <div class="row g-2 text-center">
                    <div class="col-6 col-md-3">
                        <div class="border rounded py-2 px-1 h-100">
                            <div class="text-muted small" th:text="#{staff-evaluation-results.answers}">Answers</div>
                            <div class="h5 mb-0" th:text="${result.questions.size()}">0</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="border border-success-subtle bg-success-subtle rounded py-2 px-1 h-100">
                            <div class="text-success small" th:text="#{staff-evaluation-results.matches}">Matches</div>
                            <div class="h5 mb-0 text-success" th:text="${result.matchedAnswers}">0</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="border border-danger-subtle bg-danger-subtle rounded py-2 px-1 h-100">
                            <div class="text-danger small" th:text="#{staff-evaluation-results.mismatches}">Mismatches</div>
                            <div class="h5 mb-0 text-danger" th:text="${result.mismatchedAnswers}">0</div>
                        </div>
                    </div>
                    <div class="col-6 col-md-3">
                        <div class="border border-warning-subtle bg-warning-subtle rounded py-2 px-1 h-100">
                            <div class="text-warning-emphasis small" th:text="#{staff-evaluation-results.pending}">Pending</div>
                            <div class="h5 mb-0 text-warning-emphasis"
                                 th:text="${result.questions.size() - result.verifiedAnswers}">0</div>
                        </div>
                    </div>
                </div>
                <div class="small mt-3" th:if="${result.status.name() == 'COMPLETED'}">
                    <span class="text-muted" th:text="#{staff-evaluation-results.verified-by}">Verified by:</span>
                    <span class="fw-semibold"
                          th:text="${#strings.isEmpty(result.verifiedBy) ? '—' : result.verifiedBy}">Verifier</span>
                </div>
                <div class="alert alert-warning small py-2 px-3 mt-3 mb-0"
                     th:unless="${result.status.name() == 'COMPLETED'}"
                     th:text="#{staff-evaluation-results.verification-pending}">
                    Verification is still in progress.
                </div>
            </div>
        </section>

        <div class="d-flex flex-column gap-2">
            <article class="card border-0 shadow-sm" th:each="question, iteration : ${result.questions}">
                <div class="card-body p-3">
                    <div class="d-flex justify-content-between gap-2 mb-1">
                        <div class="small">
                            <span class="text-primary fw-semibold" th:text="${question.areaKnowledge}">Area</span>
                            <span class="text-muted" th:text="${question.section}">Section</span>
                        </div>
                        <span class="badge text-bg-light" th:text="|#${iteration.count}|">#1</span>
                    </div>
                    <h2 class="h6 mb-2" th:text="${question.question}">Question</h2>

                    <div class="row g-2">
                        <div class="col-md-6">
                            <div class="border rounded py-2 px-3 h-100 d-flex justify-content-between align-items-center gap-2">
                                <div class="text-muted small" th:text="#{staff-evaluation-results.your-answer}">
                                    Your answer
                                </div>
                                <span class="badge"
                                      th:classappend="${question.response.name() == 'YES'
                                          ? 'text-bg-success'
                                          : (question.response.name() == 'NO' ? 'text-bg-danger' : 'text-bg-warning')}"
                                      th:text="${#messages.msg('AnswerResponse.' + question.response.name())}">
                                    Yes
                                </span>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="border rounded py-2 px-3 h-100 d-flex justify-content-between align-items-center gap-2">
                                <div class="text-muted small" th:text="#{staff-evaluation-results.verification-result}">
                                    Verification result
                                </div>
                                <span th:if="${question.verifiedResponse != null}"
                                      class="badge"
                                      th:classappend="${question.verifiedResponse.name() == 'YES'
                                          ? 'text-bg-success'
                                          : (question.verifiedResponse.name() == 'NO' ? 'text-bg-danger' : 'text-bg-warning')}"
                                      th:text="${#messages.msg('VerificationResponse.' + question.verifiedResponse.name())}">
                                    Agreed
                                </span>
                                <span class="text-muted"
                                      th:unless="${question.verifiedResponse != null}"
                                      th:text="#{staff-evaluation-results.not-verified}">Not verified</span>
                            </div>
                        </div>
                    </div>

                    <div class="alert alert-light border small py-2 px-3 mt-2 mb-0"
                         th:if="${!#strings.isEmpty(question.verificationComment)}">
                        <div class="fw-semibold small mb-1" th:text="#{verification.comment}">Comment</div>
                        <div class="text-break" th:text="${question.verificationComment}">Comment text</div>
                    </div>
                </div>
            </article>
        </div>

    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
